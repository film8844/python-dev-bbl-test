<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings — Appointment Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100">

<header class="bg-white border-b border-slate-200">
  <div class="mx-auto max-w-4xl px-4 py-4 flex items-center justify-between gap-4">
    <div>
      <h1 class="text-lg font-semibold text-slate-900">Appointment Booking</h1>
      <p class="text-sm text-slate-500">
        <span id="current-user"></span>
        <span id="admin-badge" class="hidden ml-1 rounded bg-amber-100 px-1.5 py-0.5 text-xs font-medium text-amber-800">admin</span>
      </p>
    </div>
    <button id="logout"
            class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
      Logout
    </button>
  </div>
</header>

<main class="mx-auto max-w-4xl px-4 py-6 space-y-6">

  <section class="bg-white rounded-xl border border-slate-200 p-6">
    <h2 class="text-base font-semibold text-slate-900">Book a time slot</h2>
    <form id="booking-form" class="mt-4 grid gap-4 sm:grid-cols-[1fr_1fr_auto] sm:items-end">
      <div>
        <label for="slot" class="block text-sm font-medium text-slate-700">Time slot</label>
        <select id="slot" required
                class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900">
        </select>
      </div>
      <div>
        <label for="note" class="block text-sm font-medium text-slate-700">Note <span class="text-slate-400">(optional)</span></label>
        <input id="note" type="text" maxlength="500"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900">
      </div>
      <button type="submit"
              class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
        Book
      </button>
    </form>
    <p id="message" class="hidden mt-4 rounded-lg px-3 py-2 text-sm"></p>
  </section>

  <section class="bg-white rounded-xl border border-slate-200">
    <div class="flex items-center justify-between gap-4 px-6 py-4 border-b border-slate-200">
      <h2 id="list-title" class="text-base font-semibold text-slate-900">My bookings</h2>
      <input id="filter" type="text" placeholder="Filter by username"
             class="hidden w-48 rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900">
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-6 py-3 font-medium">#</th>
            <th id="th-user" class="hidden px-6 py-3 font-medium">User</th>
            <th class="px-6 py-3 font-medium">Slot</th>
            <th class="px-6 py-3 font-medium">Note</th>
            <th class="px-6 py-3 font-medium">Status</th>
            <th class="px-6 py-3 font-medium text-right">Action</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </section>

</main>

<script>
const token = sessionStorage.getItem("access_token");
const isAdmin = sessionStorage.getItem("is_admin") === "true";

if (!token) {
  window.location.href = "/static/login.html";
}

const rowsEl = document.getElementById("rows");
const slotEl = document.getElementById("slot");
const filterEl = document.getElementById("filter");
const messageEl = document.getElementById("message");

document.getElementById("current-user").textContent = sessionStorage.getItem("username") || "";
if (isAdmin) {
  document.getElementById("admin-badge").classList.remove("hidden");
  document.getElementById("th-user").classList.remove("hidden");
  document.getElementById("list-title").textContent = "All bookings";
  filterEl.classList.remove("hidden");
}

function logout() {
  sessionStorage.clear();
  window.location.href = "/static/login.html";
}

function showMessage(text, kind) {
  messageEl.textContent = text;
  messageEl.className = kind === "error"
    ? "mt-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
    : "mt-4 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700";
}

function detailToText(detail) {
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map((item) => item.msg || JSON.stringify(item)).join(", ");
  return null;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`,
      ...(options.headers || {}),
    },
  });

  if (response.status === 401) {
    logout();
    throw new Error("unauthorized");
  }

  const text = await response.text();
  let data = null;
  let parsed = false;
  if (text) {
    try {
      data = JSON.parse(text);
      parsed = true;
    } catch (err) {
      parsed = false;
    }
  }

  if (!response.ok) {
    const message = parsed
      ? detailToText(data && data.detail)
      : `${response.status} ${response.statusText}: ${text.slice(0, 150)}`;
    throw new Error(message || `Request failed (${response.status})`);
  }
  return data;
}

async function loadSlots() {
  const slots = await api("/api/booking/slots");
  slotEl.innerHTML = "";
  for (const item of slots) {
    const option = document.createElement("option");
    option.value = item.slot;
    option.textContent = item.available ? item.slot : `${item.slot} (booked)`;
    option.disabled = !item.available;
    slotEl.appendChild(option);
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[ch]);
}

async function loadBookings() {
  const query = isAdmin && filterEl.value ? `?username=${encodeURIComponent(filterEl.value)}` : "";
  const bookings = await api(`/api/booking/${query}`);

  if (bookings.length === 0) {
    const columns = isAdmin ? 6 : 5;
    rowsEl.innerHTML = `<tr><td colspan="${columns}" class="px-6 py-8 text-center text-slate-400">No bookings yet</td></tr>`;
    return;
  }

  rowsEl.innerHTML = bookings.map((booking) => {
    const active = booking.status === "booked";
    const statusClass = active
      ? "bg-emerald-100 text-emerald-800"
      : "bg-slate-100 text-slate-500";
    const userCell = isAdmin ? `<td class="px-6 py-3 text-slate-700">${escapeHtml(booking.username)}</td>` : "";
    const action = active
      ? `<button data-id="${booking.id}" class="cancel rounded-lg border border-red-200 px-3 py-1 text-xs font-medium text-red-700 hover:bg-red-50">Cancel</button>`
      : `<span class="text-xs text-slate-400">—</span>`;

    return `<tr>
      <td class="px-6 py-3 text-slate-400">${booking.id}</td>
      ${userCell}
      <td class="px-6 py-3 font-medium text-slate-900">${escapeHtml(booking.slot)}</td>
      <td class="px-6 py-3 text-slate-600">${escapeHtml(booking.note) || "—"}</td>
      <td class="px-6 py-3"><span class="rounded px-2 py-0.5 text-xs font-medium ${statusClass}">${booking.status}</span></td>
      <td class="px-6 py-3 text-right">${action}</td>
    </tr>`;
  }).join("");
}

async function refresh() {
  await Promise.all([loadSlots(), loadBookings()]);
}

document.getElementById("booking-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  messageEl.classList.add("hidden");
  try {
    const booking = await api("/api/booking/", {
      method: "POST",
      body: JSON.stringify({
        slot: slotEl.value,
        note: document.getElementById("note").value || null,
      }),
    });
    document.getElementById("note").value = "";
    showMessage(`Booked ${booking.slot}`, "success");
    await refresh();
  } catch (err) {
    showMessage(err.message, "error");
  }
});

rowsEl.addEventListener("click", async (event) => {
  const button = event.target.closest(".cancel");
  if (!button) return;
  try {
    await api(`/api/booking/${button.dataset.id}`, { method: "DELETE" });
    showMessage("Booking cancelled", "success");
    await refresh();
  } catch (err) {
    showMessage(err.message, "error");
  }
});

filterEl.addEventListener("input", () => loadBookings());
document.getElementById("logout").addEventListener("click", logout);

refresh().catch((err) => showMessage(err.message, "error"));
</script>
</body>
</html>
